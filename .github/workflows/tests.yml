name: Tests

# The package tests. The model-v3.0.0 bundle is not public, so the tests that
# need it (engine-backed parity, identity and latency) skip here, like the
# re-ranker tests, whose bundles are built from diagnostic.ar-training.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest -q -s -rs
